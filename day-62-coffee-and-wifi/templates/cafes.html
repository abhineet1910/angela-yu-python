{% extends 'base.html' %}
{% block title %}Restaurants{% endblock %}

{% block content %}

<div class="container">
  <div class="row">
    <div class="col-sm-12">

      <h1>All Cafes</h1>

	  <table class="table table-dark table-striped table-hover">

          <thead>
        <tr>
            {% for heading in cafes[0] %}
                <th>{{ heading }}</th>
            {% endfor %}
        </tr>
    </thead>
           <!-- Table Body -->
    <tbody>
        {% for row in cafes[1:] %}
            <tr>
                {% for item in row %}
                    <td>{{ item }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </tbody>


  	  </table>

      <p><a href="{{ url_for('home') }}">Return to index page</a></p>
        <p>
    <a href="{{ url_for('add_cafe') }}" class="btn btn-success">
        Add New Cafe
    </a>
</p>

    </div>
  </div>
</div>

{% endblock %}
